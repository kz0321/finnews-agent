name: Tests
on:
  push:
    branches: [main, test]
  pull_request:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.9"
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests app.py
      - run: uv run pytest -q
      - run: uv run finnews batch --demo --split test --output runtime/ci-batch
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-validation
          path: runtime/ci-batch/batch-summary.json
